<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شات مباشر — Phone Mirror</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --surface2: #1a1a26;
  --surface3: #20202e;
  --border: rgba(255,255,255,0.07);
  --border2: rgba(255,255,255,0.13);
  --accent: #6c63ff;
  --accent2: #a78bfa;
  --accent-glow: rgba(108,99,255,0.25);
  --green: #34d399;
  --green-bg: rgba(52,211,153,0.1);
  --red: #f87171;
  --red-bg: rgba(248,113,113,0.1);
  --amber: #fbbf24;
  --text: #f0f0f8;
  --text2: #9090b0;
  --text3: #5a5a7a;
  --radius: 14px;
  --radius-sm: 8px;
  --radius-xs: 5px;
  --sidebar-w: 220px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Cairo', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ── Background ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image:
    linear-gradient(rgba(108,99,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(108,99,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}
.orb {
  position: fixed;
  border-radius: 50%;
  filter: blur(80px);
  pointer-events: none;
  z-index: 0;
}
.orb-1 { width: 350px; height: 350px; background: rgba(108,99,255,0.1); top: -80px; right: -80px; }
.orb-2 { width: 250px; height: 250px; background: rgba(52,211,153,0.06); bottom: 80px; left: -80px; }

/* ══════════════════════════════════════════
   JOIN SCREEN
══════════════════════════════════════════ */
#join-screen {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: 1;
  padding: 1.5rem;
}

.join-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 2rem;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(108,99,255,0.1);
  animation: fadeUp 0.5s ease both;
}

.join-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.75rem;
  justify-content: center;
}

.join-logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px;
}

.join-logo-text {
  font-size: 20px;
  font-weight: 700;
  background: linear-gradient(135deg, #fff 0%, var(--accent2) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.join-title {
  font-size: 1.4rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 0.4rem;
}
.join-sub {
  font-size: 13px;
  color: var(--text2);
  text-align: center;
  margin-bottom: 1.75rem;
  font-weight: 300;
}

.field-group {
  margin-bottom: 1rem;
}
.field-label {
  font-size: 12px;
  font-weight: 600;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  margin-bottom: 8px;
  display: block;
}

.field-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 11px 14px;
  font-family: 'Cairo', sans-serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--text);
  outline: none;
  transition: border 0.2s, box-shadow 0.2s;
}
.field-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(108,99,255,0.15);
}
.field-input::placeholder { color: var(--text3); font-weight: 300; }

.field-input.mono {
  font-family: 'JetBrains Mono', monospace;
  letter-spacing: 3px;
  font-size: 17px;
  text-align: center;
}

.join-btn {
  width: 100%;
  margin-top: 0.5rem;
  padding: 13px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  font-family: 'Cairo', sans-serif;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  box-shadow: 0 4px 20px rgba(108,99,255,0.35);
}
.join-btn:hover { background: #7c74ff; transform: translateY(-1px); box-shadow: 0 6px 26px rgba(108,99,255,0.45); }
.join-btn:active { transform: scale(0.98); }

.join-divider {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 1.25rem 0;
  color: var(--text3);
  font-size: 12px;
}
.join-divider::before, .join-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border2);
}

.back-link {
  display: block;
  text-align: center;
  font-size: 13px;
  color: var(--text3);
  text-decoration: none;
  margin-top: 1.25rem;
  transition: color 0.15s;
}
.back-link:hover { color: var(--accent2); }

.join-error {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid rgba(248,113,113,0.25);
  border-radius: var(--radius-xs);
  padding: 9px 12px;
  font-size: 13px;
  margin-top: 0.75rem;
  display: none;
}

/* ══════════════════════════════════════════
   CHAT SCREEN
══════════════════════════════════════════ */
#chat-screen {
  display: none;
  flex-direction: column;
  flex: 1;
  overflow: hidden;
  position: relative;
  z-index: 1;
}

/* ── Top Bar ── */
.chat-topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0.85rem 1.25rem;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
  z-index: 5;
}

.topbar-logo {
  width: 32px; height: 32px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}

.topbar-info { flex: 1; min-width: 0; }
.topbar-title { font-size: 15px; font-weight: 700; }
.topbar-room {
  font-size: 12px;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 1px;
}
.topbar-room span {
  font-family: 'JetBrains Mono', monospace;
  color: var(--accent2);
  font-size: 12px;
}

.topbar-actions {
  display: flex;
  gap: 6px;
}

.icon-btn {
  width: 34px; height: 34px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-xs);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--text2);
  position: relative;
}
.icon-btn:hover { background: var(--surface3); color: var(--text); }
.icon-btn .tooltip {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 5px;
  padding: 4px 8px;
  font-size: 11px;
  white-space: nowrap;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
}
.icon-btn:hover .tooltip { opacity: 1; }

.online-badge {
  display: flex;
  align-items: center;
  gap: 5px;
  background: var(--green-bg);
  border: 1px solid rgba(52,211,153,0.2);
  border-radius: 50px;
  padding: 4px 10px;
  font-size: 12px;
  color: var(--green);
  font-weight: 600;
  flex-shrink: 0;
}
.online-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s infinite;
}

/* ── Main Area ── */
.chat-main {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── Sidebar ── */
.chat-sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  transition: transform 0.25s ease;
}

.sidebar-header {
  padding: 1rem;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.sidebar-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text3);
}

.users-list {
  flex: 1;
  overflow-y: auto;
  padding: 0.5rem;
}
.users-list::-webkit-scrollbar { width: 3px; }
.users-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.user-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: var(--radius-xs);
  font-size: 13px;
  font-weight: 500;
  animation: fadeUp 0.2s ease both;
}
.user-item.me { background: rgba(108,99,255,0.08); color: var(--accent2); }
.user-avatar {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: var(--surface3);
  border: 1px solid var(--border2);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
  flex-shrink: 0;
}
.user-item.me .user-avatar { background: var(--accent-glow); border-color: rgba(108,99,255,0.4); }
.user-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.user-you-tag {
  font-size: 10px;
  background: var(--accent-glow);
  color: var(--accent2);
  border-radius: 4px;
  padding: 1px 5px;
  font-weight: 600;
}

/* ── Messages Area ── */
.chat-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  min-width: 0;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 1rem;
  display: flex;
  flex-direction: column;
  gap: 2px;
  scroll-behavior: smooth;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* System messages */
.sys-msg {
  display: flex;
  justify-content: center;
  margin: 8px 0;
}
.sys-bubble {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 50px;
  padding: 5px 14px;
  font-size: 12px;
  color: var(--text3);
  font-weight: 500;
}

/* Chat messages */
.msg-group {
  display: flex;
  flex-direction: column;
  margin-top: 6px;
}
.msg-group.mine { align-items: flex-start; }
.msg-group.theirs { align-items: flex-end; }

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  padding: 0 2px;
}
.msg-group.mine .msg-meta { flex-direction: row; }
.msg-group.theirs .msg-meta { flex-direction: row-reverse; }

.msg-author {
  font-size: 12px;
  font-weight: 600;
  color: var(--accent2);
}
.msg-time {
  font-size: 11px;
  color: var(--text3);
  font-family: 'JetBrains Mono', monospace;
}

.msg-bubble {
  max-width: min(70%, 380px);
  padding: 9px 13px;
  border-radius: 12px;
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
  white-space: pre-wrap;
}

.msg-group.mine .msg-bubble {
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 12px 12px 12px 3px;
  color: var(--text);
}
.msg-group.theirs .msg-bubble {
  background: linear-gradient(135deg, rgba(108,99,255,0.25), rgba(167,139,250,0.2));
  border: 1px solid rgba(108,99,255,0.3);
  border-radius: 12px 12px 3px 12px;
  color: var(--text);
}

/* Consecutive messages (same author) */
.msg-group.mine .msg-bubble + .msg-bubble { border-radius: 12px 12px 12px 3px; margin-top: 2px; }
.msg-group.theirs .msg-bubble + .msg-bubble { border-radius: 12px 12px 3px 12px; margin-top: 2px; }

/* Typing indicator */
.typing-indicator {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  font-size: 12px;
  color: var(--text3);
  min-height: 28px;
  flex-shrink: 0;
}
.typing-dots {
  display: flex;
  gap: 3px;
}
.typing-dots span {
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--text3);
  animation: typingBounce 1.2s infinite;
}
.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typingBounce {
  0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
  40% { transform: translateY(-4px); opacity: 1; }
}

/* ── Input Bar ── */
.chat-input-bar {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  padding: 0.85rem 1rem;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
}

.msg-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: 10px;
  padding: 10px 14px;
  font-family: 'Cairo', sans-serif;
  font-size: 14px;
  color: var(--text);
  outline: none;
  resize: none;
  max-height: 120px;
  min-height: 42px;
  transition: border 0.2s;
  line-height: 1.5;
  direction: rtl;
}
.msg-input:focus { border-color: var(--accent); }
.msg-input::placeholder { color: var(--text3); }

.send-btn {
  width: 42px; height: 42px;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
  box-shadow: 0 3px 14px rgba(108,99,255,0.35);
}
.send-btn:hover { background: #7c74ff; transform: scale(1.05); }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* ── Sidebar toggle (mobile) ── */
.sidebar-toggle {
  display: none;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--surface3);
  border: 1px solid var(--border2);
  border-radius: 50px;
  padding: 8px 18px;
  font-size: 13px;
  color: var(--text);
  opacity: 0;
  transition: all 0.25s;
  z-index: 100;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Animations ── */
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Responsive ── */
@media (max-width: 600px) {
  :root { --sidebar-w: 180px; }

  .chat-sidebar {
    position: absolute;
    top: 57px;
    left: 0;
    bottom: 0;
    z-index: 20;
    transform: translateX(100%);
    border-right: 1px solid var(--border);
  }
  .chat-sidebar.open { transform: translateX(0); }

  .sidebar-toggle { display: flex; }

  .msg-bubble { max-width: 85%; }
  .chat-topbar { padding: 0.7rem 1rem; }

  .online-badge { display: none; }
}
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- ══════════════════════════════════════════
  JOIN SCREEN
══════════════════════════════════════════ -->
<div id="join-screen">
  <div class="join-card">
    <div class="join-logo">
      <div class="join-logo-icon">💬</div>
      <div class="join-logo-text">شات مباشر</div>
    </div>

    <div class="join-title">ادخل إلى الغرفة</div>
    <div class="join-sub">شات لحظي مشفر · بدون تسجيل · بدون تثبيت</div>

    <div class="field-group">
      <label class="field-label" for="inp-name">اسمك المستعار</label>
      <input id="inp-name" class="field-input" type="text" placeholder="أدخل اسمك..." maxlength="20"
        autocomplete="off" spellcheck="false" />
    </div>

    <div class="field-group">
      <label class="field-label" for="inp-room">رمز الغرفة</label>
      <input id="inp-room" class="field-input mono" type="text" placeholder="مثال: ABC123"
        maxlength="8" autocomplete="off" spellcheck="false"
        oninput="this.value=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')" />
    </div>

    <button class="join-btn" id="join-btn" onclick="joinChat()">دخول الغرفة →</button>

    <div class="join-error" id="join-error"></div>

    <div class="join-divider">أو</div>

    <button class="join-btn" style="background: var(--surface2); color: var(--text2); border: 1px solid var(--border2); box-shadow: none;"
      onclick="joinRandom()">إنشاء غرفة جديدة عشوائية</button>

    <a href="/" class="back-link">← العودة إلى Phone Mirror</a>
  </div>
</div>

<!-- ══════════════════════════════════════════
  CHAT SCREEN
══════════════════════════════════════════ -->
<div id="chat-screen">

  <!-- Top Bar -->
  <div class="chat-topbar">
    <div class="topbar-logo">💬</div>
    <div class="topbar-info">
      <div class="topbar-title" id="topbar-title">شات مباشر</div>
      <div class="topbar-room">
        الغرفة: <span id="topbar-room">—</span>
      </div>
    </div>

    <div class="online-badge">
      <div class="online-dot"></div>
      <span id="online-count">0</span> متصل
    </div>

    <div class="topbar-actions">
      <div class="icon-btn sidebar-toggle" onclick="toggleSidebar()" title="الأعضاء">
        👥
        <div class="tooltip">الأعضاء</div>
      </div>
      <div class="icon-btn" onclick="copyRoomCode()">
        📋
        <div class="tooltip">نسخ الرمز</div>
      </div>
      <div class="icon-btn" onclick="leaveRoom()">
        🚪
        <div class="tooltip">مغادرة</div>
      </div>
    </div>
  </div>

  <!-- Main -->
  <div class="chat-main">

    <!-- Messages -->
    <div class="chat-body">
      <div class="messages" id="messages"></div>
      <div class="typing-indicator" id="typing-indicator"></div>

      <!-- Input Bar -->
      <div class="chat-input-bar">
        <textarea class="msg-input" id="msg-input"
          placeholder="اكتب رسالتك..."
          rows="1"
          onkeydown="handleInputKey(event)"
          oninput="handleInputChange(this)"></textarea>
        <button class="send-btn" id="send-btn" onclick="sendMessage()" disabled>➤</button>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="chat-sidebar" id="chat-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-label">الأعضاء</div>
      </div>
      <div class="users-list" id="users-list"></div>
    </div>

  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════
//   Chat Client — Phone Mirror
// ══════════════════════════════════════════════════

const socket = io();

let myName = '';
let myRoom = '';
let typingTimer = null;
let isTyping = false;
let typingUsers = new Set();

// ── Audio ────────────────────────────────────────
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function playNotif() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';
    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(660, audioCtx.currentTime + 0.12);
    gain.gain.setValueAtTime(0.18, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
    osc.start(audioCtx.currentTime);
    osc.stop(audioCtx.currentTime + 0.25);
  } catch(e) {}
}

// ── Join ─────────────────────────────────────────
function joinChat() {
  const name = document.getElementById('inp-name').value.trim();
  const room = document.getElementById('inp-room').value.trim().toUpperCase();
  const errEl = document.getElementById('join-error');

  if (!name) { showJoinError('أدخل اسمك المستعار'); return; }
  if (!room || room.length < 3) { showJoinError('أدخل رمز الغرفة (3 أحرف على الأقل)'); return; }

  errEl.style.display = 'none';
  document.getElementById('join-btn').textContent = 'جاري الدخول...';
  document.getElementById('join-btn').disabled = true;

  socket.emit('chat:join', { roomId: room, name });
}

function joinRandom() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id = '';
  for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  document.getElementById('inp-room').value = id;
  const nameEl = document.getElementById('inp-name');
  if (!nameEl.value.trim()) nameEl.focus();
  else joinChat();
}

function showJoinError(msg) {
  const el = document.getElementById('join-error');
  el.textContent = '⚠ ' + msg;
  el.style.display = 'block';
  document.getElementById('join-btn').textContent = 'دخول الغرفة →';
  document.getElementById('join-btn').disabled = false;
}

// ── Keyboard ─────────────────────────────────────
document.getElementById('inp-name').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('inp-room').focus(); });
document.getElementById('inp-room').addEventListener('keydown', e => { if (e.key === 'Enter') joinChat(); });

// ── Socket Events ─────────────────────────────────
socket.on('chat:joined', ({ name, roomId, history, users }) => {
  myName = name;
  myRoom = roomId;

  document.getElementById('join-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';

  document.getElementById('topbar-room').textContent = roomId;
  document.getElementById('topbar-title').textContent = name;

  renderUsers(users);
  document.getElementById('msg-input').focus();

  // History
  if (history.length > 0) {
    addSysMsg('── آخر ' + history.length + ' رسالة ──');
    history.forEach(msg => renderMessage(msg, false));
    addSysMsg('── نهاية السجل ──');
  } else {
    addSysMsg('مرحباً بك في الغرفة 🎉');
  }

  scrollToBottom();
  showToast('مرحباً ' + name + '!');
});

socket.on('chat:message', (msg) => {
  const isMe = msg.user === myName;
  renderMessage(msg, true);
  if (!isMe) playNotif();
  scrollToBottom();
});

socket.on('chat:user-joined', ({ name, users }) => {
  addSysMsg('🟢 ' + name + ' انضم إلى الغرفة');
  renderUsers(users);
  scrollToBottom();
});

socket.on('chat:user-left', ({ name, users }) => {
  addSysMsg('🔴 ' + name + ' غادر الغرفة');
  renderUsers(users);
  typingUsers.delete(name);
  updateTypingDisplay();
  scrollToBottom();
});

socket.on('chat:typing', ({ name, isTyping: typing }) => {
  if (typing) typingUsers.add(name);
  else typingUsers.delete(name);
  updateTypingDisplay();
});

socket.on('disconnect', () => {
  addSysMsg('⚠ انقطع الاتصال بالسيرفر');
});

socket.on('connect', () => {
  if (myRoom) {
    addSysMsg('✅ أعيد الاتصال');
    socket.emit('chat:join', { roomId: myRoom, name: myName });
  }
});

// ── Render Message ────────────────────────────────
function renderMessage(msg, animate) {
  const isMe = msg.user === myName;
  const messagesEl = document.getElementById('messages');

  // Check if last group is same author
  const lastGroup = messagesEl.querySelector('.msg-group:last-child');
  const lastAuthor = lastGroup ? lastGroup.dataset.author : null;

  if (lastAuthor === msg.user) {
    // Append bubble to existing group
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;
    lastGroup.appendChild(bubble);
  } else {
    const group = document.createElement('div');
    group.className = 'msg-group ' + (isMe ? 'mine' : 'theirs');
    group.dataset.author = msg.user;
    if (animate) group.style.animation = 'slideIn 0.2s ease both';

    const meta = document.createElement('div');
    meta.className = 'msg-meta';

    const author = document.createElement('div');
    author.className = 'msg-author';
    author.textContent = isMe ? 'أنت' : msg.user;

    const time = document.createElement('div');
    time.className = 'msg-time';
    time.textContent = formatTime(msg.time);

    meta.appendChild(author);
    meta.appendChild(time);

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.textContent = msg.text;

    group.appendChild(meta);
    group.appendChild(bubble);
    messagesEl.appendChild(group);
  }
}

function addSysMsg(text) {
  const messagesEl = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'sys-msg';
  div.innerHTML = `<div class="sys-bubble">${text}</div>`;
  messagesEl.appendChild(div);
}

function renderUsers(users) {
  const list = document.getElementById('users-list');
  list.innerHTML = '';
  document.getElementById('online-count').textContent = users.length;

  users.forEach(name => {
    const isMe = name === myName;
    const item = document.createElement('div');
    item.className = 'user-item' + (isMe ? ' me' : '');

    const avatar = document.createElement('div');
    avatar.className = 'user-avatar';
    avatar.textContent = name.charAt(0).toUpperCase();

    const nameEl = document.createElement('div');
    nameEl.className = 'user-name';
    nameEl.textContent = name;

    item.appendChild(avatar);
    item.appendChild(nameEl);

    if (isMe) {
      const tag = document.createElement('div');
      tag.className = 'user-you-tag';
      tag.textContent = 'أنت';
      item.appendChild(tag);
    }

    list.appendChild(item);
  });
}

// ── Typing ────────────────────────────────────────
function handleInputChange(el) {
  // Auto-resize
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';

  // Send button
  document.getElementById('send-btn').disabled = !el.value.trim();

  // Typing indicator
  if (!isTyping) {
    isTyping = true;
    socket.emit('chat:typing', true);
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => {
    isTyping = false;
    socket.emit('chat:typing', false);
  }, 1500);
}

function handleInputKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function updateTypingDisplay() {
  const el = document.getElementById('typing-indicator');
  if (typingUsers.size === 0) {
    el.innerHTML = '';
    return;
  }
  const names = [...typingUsers].slice(0, 3).join('، ');
  const suffix = typingUsers.size === 1 ? ' يكتب...' : ' يكتبون...';
  el.innerHTML = `
    <div class="typing-dots"><span></span><span></span><span></span></div>
    <span>${names}${suffix}</span>
  `;
}

// ── Send ─────────────────────────────────────────
function sendMessage() {
  const el = document.getElementById('msg-input');
  const text = el.value.trim();
  if (!text || !myRoom) return;

  socket.emit('chat:message', text);

  el.value = '';
  el.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;

  clearTimeout(typingTimer);
  isTyping = false;
  socket.emit('chat:typing', false);

  el.focus();
}

// ── Helpers ───────────────────────────────────────
function scrollToBottom() {
  const el = document.getElementById('messages');
  requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

function formatTime(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  } catch { return ''; }
}

function copyRoomCode() {
  navigator.clipboard.writeText(myRoom).then(() => showToast('تم نسخ رمز الغرفة: ' + myRoom));
}

function leaveRoom() {
  if (confirm('هل تريد مغادرة الغرفة؟')) {
    window.location.reload();
  }
}

function toggleSidebar() {
  document.getElementById('chat-sidebar').classList.toggle('open');
}

// Close sidebar on outside tap (mobile)
document.getElementById('messages').addEventListener('click', () => {
  document.getElementById('chat-sidebar').classList.remove('open');
});

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}
</script>
